<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SiMANISE2026</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .page-content { display: none; animation: fadeIn 0.3s ease-in-out; }
        .page-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .table-container { max-height: 65vh; overflow-y: auto; }
        thead { position: sticky; top: 0; background-color: #f3f4f6; z-index: 10; box-shadow: 0 1px 2px rgba(0,0,0,0.05);}
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
    </style>
</head>
<body class="bg-gray-100 font-sans text-gray-800 flex h-screen overflow-hidden">

    <aside class="w-64 bg-gray-900 text-white flex flex-col transition-all duration-300 z-30">
        <div class="p-6 border-b border-gray-800">
            <h1 class="text-xl font-bold text-orange-400"><i class="fas fa-chart-line mr-2"></i>SIMPANSE</h1>
            <p class="text-xs text-gray-400 mt-1">SIstem Manajemen Penyelesaian ANomali SE2026</p>
        </div>
        <nav class="flex-1 p-4 space-y-2">
            <button onclick="switchPage('dashboard')" id="nav-dashboard" class="nav-btn w-full flex items-center p-3 text-left rounded-lg bg-orange-600 text-white hover:bg-orange-500 transition shadow-md">
                <i class="fas fa-tachometer-alt w-6"></i> Dashboard
            </button>
            <button onclick="switchPage('keluarga')" id="nav-keluarga" class="nav-btn w-full flex items-center p-3 text-left rounded-lg text-gray-300 hover:bg-gray-800 transition">
                <i class="fas fa-users w-6"></i> Data Keluarga
            </button>
            <button onclick="switchPage('usaha')" id="nav-usaha" class="nav-btn w-full flex items-center p-3 text-left rounded-lg text-gray-300 hover:bg-gray-800 transition">
                <i class="fas fa-store w-6"></i> Data Usaha
            </button>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col h-screen overflow-hidden relative">
        <header class="bg-white shadow-sm p-4 flex justify-between items-center z-20">
            <h2 id="header-title" class="text-2xl font-bold text-gray-800">Dashboard Interaktif</h2>
            <div class="flex items-center text-sm text-gray-600">
                <i class="far fa-calendar-alt mr-2"></i> <span id="current-date">Hari Ini</span>
                <div class="ml-6 w-8 h-8 bg-blue-500 rounded-full flex items-center justify-center text-white font-bold shadow-md">A</div>
            </div>
        </header>
        
        <div class="p-6 flex-1 overflow-y-auto">
            
            <!-- HALAMAN: DASHBOARD -->
            <div id="page-dashboard" class="page-content active h-full flex flex-col">
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 mb-4 flex gap-4 items-end">
                    <div>
                        <label class="block text-xs font-bold text-gray-600 mb-1">Pilih Tanggal</label>
                        <!-- DIUBAH MENJADI DROPDOWN -->
                        <select id="dash-tgl" class="border border-gray-300 p-2 rounded-lg text-sm w-48 focus:ring-2 focus:ring-orange-400 outline-none">
                            <option value="">Memuat tanggal...</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-600 mb-1">Pilih Anomali</label>
                        <select id="dash-tipe" class="border border-gray-300 p-2 rounded-lg text-sm focus:ring-2 focus:ring-orange-400 outline-none">
                            <option value="Keluarga">Keluarga</option>
                            <option value="Usaha">Usaha</option>
                            <option value="Keluarga+Usaha">Keluarga+Usaha</option>
                        </select>
                    </div>
                    <button onclick="tarikDashboard()" class="bg-orange-600 text-white px-5 py-2 rounded-lg text-sm font-bold hover:bg-orange-500 shadow-sm transition h-[38px] flex items-center">
                        <i class="fas fa-play mr-2"></i> Jalankan
                    </button>
                </div>
                
                <div id="dash-container" class="grid grid-cols-1 lg:grid-cols-3 gap-4">
                    <div class="col-span-1 lg:col-span-3 bg-white p-10 rounded-xl shadow-sm border border-gray-200 text-center text-gray-400">
                        <i class="fas fa-chart-pie text-4xl mb-3 block opacity-50"></i>
                        Tekan "Jalankan" untuk memuat ringkasan data.
                    </div>
                </div>
            </div>
            
            <!-- HALAMAN: TABEL DATA -->
            <div id="page-data" class="page-content hidden h-full flex flex-col">
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 mb-4 flex flex-wrap justify-between items-end gap-4">
                    <div class="flex flex-wrap gap-4 items-end w-full lg:w-auto">
                        
                        <div>
                            <label class="block font-semibold text-xs text-gray-600 mb-1">Tanggal Data <span class="text-red-500">*</span></label>
                            <!-- DIUBAH MENJADI DROPDOWN -->
                            <select id="input-tanggal" class="border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-orange-400 outline-none w-full min-w-[140px]">
                                <option value="">Memuat tanggal...</option>
                            </select>
                        </div>
                        
                        <div class="bg-purple-50 p-1.5 -m-1.5 rounded-lg border border-purple-100 flex items-end gap-3">
                            <div>
                                <label class="block font-semibold text-xs text-purple-700 mb-1"><i class="fas fa-history mr-1"></i>Tgl Pembanding (Opsional)</label>
                                <!-- DROPDOWN BARU: UNTUK LOGIKA IRISAN -->
                                <select id="input-tgl-banding" class="border border-purple-200 rounded-lg p-2 text-sm focus:ring-2 focus:ring-purple-400 outline-none w-full min-w-[140px] bg-white">
                                    <option value="">-- Tidak Ada --</option>
                                </select>
                            </div>
                        </div>

                        <div>
                            <label class="block font-semibold text-xs text-gray-600 mb-1">PML <span class="text-red-500">*</span></label>
                            <select id="input-pml" onchange="renderDropdownPcl()" class="border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-orange-400 outline-none w-full min-w-[150px]">
                                <option value="">Memuat data...</option>
                            </select>
                        </div>
                        <div>
                            <label class="block font-semibold text-xs text-gray-600 mb-1">PCL (Opsional)</label>
                            <select id="input-pcl" class="border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-orange-400 outline-none w-full min-w-[150px]" disabled>
                                <option value="">Pilih PML dahulu</option>
                            </select>
                        </div>
                        <button onclick="tarikData()" id="btn-tarik" class="bg-gray-800 text-white px-5 py-2 rounded-lg text-sm font-semibold hover:bg-gray-700 transition shadow-sm flex items-center h-[38px]">
                            <i class="fas fa-sync-alt mr-2"></i> Tarik
                        </button>
                    </div>
                    <div id="status-text" class="text-sm font-medium text-blue-600 hidden whitespace-nowrap"><i class="fas fa-spinner fa-spin mr-1"></i> Berkomunikasi dengan Server...</div>
                </div>
                
                <div class="bg-white flex-1 rounded-xl shadow-sm border border-gray-200 table-container">
                    <table class="w-full text-left text-sm whitespace-nowrap">
                        <thead>
                            <tr class="text-gray-700">
                                <th class="p-4 border-b w-1/4 whitespace-normal" id="th-nama">Nama</th>
                                <th class="p-4 border-b w-64">Anomali</th>
                                <th class="p-4 border-b text-center">Fasih</th>
                                <th class="p-4 border-b">PML</th>
                                <th class="p-4 border-b">PCL</th>
                                <th class="p-4 border-b">Pengerjaan</th>
                                <th class="p-4 border-b min-w-[300px]">Catatan</th>
                            </tr>
                        </thead>
                        <tbody id="tabel-body" class="divide-y divide-gray-100 text-gray-600">
                            <tr><td colspan="7" class="p-8 text-center text-gray-400"><i class="fas fa-inbox text-3xl mb-2 block"></i>Silakan tentukan filter lalu tekan "Tarik"</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <script>
        // GANTI teks di bawah ini dengan URL Web App Apps Script Anda yang terbaru!
        const API_URL = "https://script.google.com/macros/s/AKfycbxLgpQJ5jJbr8NvRTQD0DyuW_oRfVGlf8wOH2nFQCS31QaaLJnDBoTRek68fHZj5k-0Kg/exec";
        
        let currentMode = 'dashboard';
        let dataMitraGlobal = {}; 

        document.getElementById('current-date').innerText = new Date().toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

        // --- FUNGSI: Mengambil Mitra & Tanggal dari Server ---
        async function muatDataMitra() {
            try {
                const requestOptions = {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: "getMitra" })
                };
                
                const response = await fetch(API_URL, requestOptions);
                const result = await response.json();
                
                if (result.status === "sukses") {
                    dataMitraGlobal = result.data;
                    renderDropdownPml();
                    renderDropdownTanggal(result.dates); // Merender dropdown tanggal
                }
            } catch (error) {
                console.error("Gagal memuat data awal:", error);
                document.getElementById('input-pml').innerHTML = '<option value="">Gagal memuat data</option>';
            }
        }

        // --- FUNGSI BARU: Render Dropdown Tanggal ---
        function renderDropdownTanggal(dates) {
            let optionsTanggal = '';
            let optionsBanding = '<option value="">-- Tidak Ada --</option>'; // Khusus opsi pembanding
            
            if(dates.length === 0) {
                optionsTanggal = '<option value="">Tidak ada tanggal</option>';
            } else {
                dates.forEach(d => {
                    optionsTanggal += `<option value="${d}">${d}</option>`;
                    optionsBanding += `<option value="${d}">${d}</option>`;
                });
            }

            document.getElementById('dash-tgl').innerHTML = optionsTanggal;
            document.getElementById('input-tanggal').innerHTML = optionsTanggal;
            document.getElementById('input-tgl-banding').innerHTML = optionsBanding;
        }

        function renderDropdownPml() {
            const pmlSelect = document.getElementById('input-pml');
            pmlSelect.innerHTML = '<option value="">-- Pilih PML --</option>';
            const daftarPml = Object.keys(dataMitraGlobal).sort();
            
            daftarPml.forEach(pml => {
                let option = document.createElement('option');
                option.value = pml; option.text = pml;
                pmlSelect.appendChild(option);
            });
        }

        function renderDropdownPcl() {
            const pmlTerpilih = document.getElementById('input-pml').value;
            const pclSelect = document.getElementById('input-pcl');
            pclSelect.innerHTML = '<option value="">-- Semua PCL --</option>';
            
            if (pmlTerpilih && dataMitraGlobal[pmlTerpilih]) {
                pclSelect.disabled = false;
                const daftarPcl = dataMitraGlobal[pmlTerpilih].sort();
                daftarPcl.forEach(pcl => {
                    let option = document.createElement('option');
                    option.value = pcl; option.text = pcl;
                    pclSelect.appendChild(option);
                });
            } else {
                pclSelect.innerHTML = '<option value="">Pilih PML dahulu</option>';
                pclSelect.disabled = true;
            }
        }

        window.onload = () => {
            muatDataMitra();
        };

        // UI Navigasi Sidebar
        function switchPage(mode) {
            currentMode = mode;
            
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('bg-orange-600', 'text-white', 'shadow-md'); 
                btn.classList.add('text-gray-300');
            });
            document.querySelectorAll('.page-content').forEach(p => {
                p.classList.remove('active');
                p.classList.add('hidden');
            });

            const activeBtn = document.getElementById('nav-' + mode);
            activeBtn.classList.remove('text-gray-300');
            activeBtn.classList.add('bg-orange-600', 'text-white', 'shadow-md');
            
            if(mode === 'dashboard') {
                document.getElementById('page-dashboard').classList.remove('hidden');
                document.getElementById('page-dashboard').classList.add('active');
                document.getElementById('header-title').innerText = 'Dashboard Interaktif';
            } else {
                document.getElementById('page-data').classList.remove('hidden');
                document.getElementById('page-data').classList.add('active');
                document.getElementById('header-title').innerText = mode === 'keluarga' ? 'Manajemen Data Keluarga' : 'Manajemen Data Usaha';
                document.getElementById('th-nama').innerText = mode === 'keluarga' ? 'Nama Kepala Keluarga' : 'Nama Usaha';
                document.getElementById('tabel-body').innerHTML = '<tr><td colspan="7" class="p-8 text-center text-gray-400">Silakan tentukan filter lalu tekan "Tarik"</td></tr>';
            }
        }

        // --- FUNGSI UTAMA: Tarik Data Tabel ---
        async function tarikData() {
            const btn = document.getElementById('btn-tarik');
            const status = document.getElementById('status-text');
            const tgl = document.getElementById('input-tanggal').value;
            const tglBanding = document.getElementById('input-tgl-banding').value; // Mengambil input Tgl Pembanding
            const pml = document.getElementById('input-pml').value.trim();
            const pcl = document.getElementById('input-pcl').value.trim();
            const tbody = document.getElementById('tabel-body');

            if (!tgl || !pml) {
                alert("Opps! Harap lengkapi isian Tanggal Data dan Nama PML.");
                return;
            }
            if (tgl === tglBanding) {
                alert("Tanggal Pembanding tidak boleh sama dengan Tanggal Data.");
                return;
            }

            btn.disabled = true; btn.classList.add('opacity-50');
            status.classList.remove('hidden', 'text-red-600'); status.classList.add('text-blue-600');
            status.innerHTML = `<i class="fas fa-spinner fa-spin mr-1"></i> Mengunduh dan menganalisis data...`;
            tbody.innerHTML = '<tr><td colspan="7" class="p-8 text-center text-gray-500"><i class="fas fa-circle-notch fa-spin text-2xl mb-3 block text-orange-400"></i>Memuat data. Ini mungkin memakan waktu beberapa detik...</td></tr>';

            try {
                const requestOptions = {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, 
                    body: JSON.stringify({ 
                        action: "ambilData", 
                        tipe: currentMode, 
                        tanggal: tgl, 
                        pml: pml, 
                        pcl: pcl,
                        tglBanding: tglBanding // Kirim ke Backend
                    })
                };

                const response = await fetch(API_URL, requestOptions);
                const result = await response.json();

                if (result.status === "sukses") {
                    renderTabel(result.data, tglBanding);
                } else {
                    throw new Error(result.pesan);
                }
            } catch (error) {
                tbody.innerHTML = `<tr><td colspan="7" class="p-8 text-center text-red-500 font-bold"><i class="fas fa-exclamation-triangle mr-2"></i>Gagal menarik data: ${error.message}</td></tr>`;
                status.classList.add('hidden');
            } finally {
                btn.disabled = false; btn.classList.remove('opacity-50');
                setTimeout(() => status.classList.add('hidden'), 2000);
            }
        }

        // Render hasil tarikan data ke HTML
        function renderTabel(data, tglBanding) {
            const tbody = document.getElementById('tabel-body');
            tbody.innerHTML = '';
            
            if(data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="p-8 text-center text-gray-500">Hebat! Tidak ada temuan anomali pada filter ini.</td></tr>';
                return;
            }

            data.forEach((row) => {
                let statusColor = row.status === "Sudah Konfirmasi" ? "bg-green-100 text-green-700" : 
                                  row.status === "Sedang Konfirmasi" ? "bg-yellow-100 text-yellow-700" : "bg-red-100 text-red-700";
                
                let linkFasihBtn = row.linkFasih ? 
                    `<a href="${row.linkFasih}" target="_blank" class="text-blue-500 hover:text-white hover:bg-blue-500 bg-blue-50 p-2 rounded-lg transition shadow-sm inline-block" title="Buka Aplikasi Fasih"><i class="fas fa-external-link-alt"></i></a>` : 
                    `<span class="text-gray-300 inline-block p-2" title="Tidak ada link"><i class="fas fa-unlink"></i></span>`;

                let anomaliTeks = row.anomali ? row.anomali.toString().replace(/"/g, '&quot;') : "";
                
                // --- LOGIKA VISUAL BADGE IRISAN (JIKA ADA) ---
                let badgeIrisan = row.isIrisan ? 
                    `<div class="mt-1"><span class="inline-flex items-center gap-1 rounded-full bg-purple-100 px-2 py-0.5 text-[10px] font-bold text-purple-700 border border-purple-200" title="Muncul juga pada data ${tglBanding}"><i class="fas fa-history"></i>Sisa ${tglBanding}</span></div>` : "";

                let tr = document.createElement('tr');
                tr.classList.add('hover:bg-orange-50', 'transition', 'group', 'border-b', 'border-gray-100');
                tr.innerHTML = `
                    <td class="p-4 font-semibold text-gray-800 whitespace-normal">
                        ${row.nama}
                    </td>
                    
                    <td class="p-4 whitespace-normal">
                        <div class="inline-block text-red-600 text-xs font-bold bg-red-50 px-2 py-1.5 rounded-lg border border-red-100 cursor-help line-clamp-2" title="${anomaliTeks}">
                            ${row.anomali}
                        </div>
                        ${badgeIrisan} <!-- Cetak Badge Disini -->
                    </td>
                    
                    <td class="p-4 text-center">${linkFasihBtn}</td>
                    <td class="p-4 text-xs font-bold text-gray-600">${row.pml}</td>
                    <td class="p-4 text-xs font-medium text-gray-500">${row.pcl}</td>
                    
                    <td class="p-4">
                        <select onchange="updateData('${row.id}', 'Pengerjaan', this)" class="p-1.5 text-xs font-bold border rounded-md shadow-sm outline-none cursor-pointer ${statusColor}">
                            <option value="Belum Konfirmasi" ${row.status === "Belum Konfirmasi" ? "selected":""}>Belum Konfirmasi</option>
                            <option value="Sedang Konfirmasi" ${row.status === "Sedang Konfirmasi" ? "selected":""}>Sedang Konfirmasi</option>
                            <option value="Sudah Konfirmasi" ${row.status === "Sudah Konfirmasi" ? "selected":""}>Sudah Konfirmasi</option>
                        </select>
                    </td>
                    
                    <td class="p-4 min-w-[250px]">
                        <textarea onchange="updateData('${row.id}', 'Catatan', this)" class="w-full border-b-2 border-transparent bg-transparent focus:border-orange-500 outline-none px-2 py-1 text-sm group-hover:bg-white group-hover:border-gray-200 transition rounded resize-y text-gray-700" rows="1" placeholder="Ketik catatan...">${row.catatan}</textarea>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function updateData(id, kolom, inputElement) {
            const nilaiBaru = inputElement.value;
            const status = document.getElementById('status-text');
            
            if(document.getElementById('page-data').classList.contains('active')) {
                status.innerHTML = `<i class="fas fa-spinner fa-spin mr-1"></i> Menyimpan...`;
                status.classList.remove('hidden', 'text-blue-600', 'text-green-600', 'text-red-600');
                status.classList.add('text-orange-500');
            }
            inputElement.disabled = true;

            try {
                const requestOptions = {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: "updateData", tipe: currentMode, id: id, kolom: kolom, nilai: nilaiBaru })
                };
                const response = await fetch(API_URL, requestOptions);
                const result = await response.json();

                if (result.status === "sukses") {
                    status.innerHTML = `<i class="fas fa-check mr-1"></i> Tersimpan!`;
                    status.classList.replace('text-orange-500', 'text-green-600');
                    if(kolom === 'Pengerjaan') {
                        inputElement.className = `p-1.5 text-xs font-bold border rounded-md shadow-sm outline-none cursor-pointer ${nilaiBaru === 'Sudah Konfirmasi' ? 'bg-green-100 text-green-700' : nilaiBaru === 'Sedang Konfirmasi' ? 'bg-yellow-100 text-yellow-700' : 'bg-red-100 text-red-700'}`;
                    }
                } else throw new Error(result.pesan);
            } catch (error) {
                alert("Gagal menyimpan data: " + error.message);
            } finally {
                inputElement.disabled = false;
                setTimeout(() => status.classList.add('hidden'), 3000);
            }
        }

        // --- FUNGSI: Tarik dan Render Dashboard Pivot ---
        async function tarikDashboard() {
            const container = document.getElementById('dash-container');
            const tgl = document.getElementById('dash-tgl').value;
            const tipe = document.getElementById('dash-tipe').value;
            
            if(!tgl) { alert("Harap pilih tanggal untuk memuat Dashboard."); return; }
            
            container.innerHTML = '<div class="col-span-3 text-center p-10"><i class="fas fa-circle-notch fa-spin text-4xl text-orange-400 mb-3 block"></i><p class="text-gray-500 font-medium">Menghitung Agregat Data...</p></div>';
            
            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: "getDashboard", tipe, tanggal: tgl })
                });
                const {data} = await res.json();
                
                if(Object.keys(data.kec).length === 0) {
                     container.innerHTML = '<div class="col-span-3 bg-green-50 text-center p-10 rounded-xl border border-green-200"><i class="fas fa-check-circle text-4xl text-green-500 mb-3 block"></i><p class="text-green-700 font-bold">Luar Biasa! Tidak ada anomali untuk filter ini.</p></div>';
                     return;
                }

                container.innerHTML = `
                    ${renderTabelDash('Berdasarkan Kecamatan', data.kec, ['Kecamatan', 'Jml Anomali', 'Tindak Lanjut'])}
                    ${renderTabelDash('Berdasarkan PML', data.pml, ['PML', 'Jml Anomali', 'Tindak Lanjut'])}
                    ${renderTabelDash('Struktur PML & PCL', data.pmlPcl, ['PML', 'PCL', 'Jml Anomali', 'Tindak Lanjut'])}
                `;
            } catch (error) {
                container.innerHTML = `<div class="col-span-3 text-center p-10 text-red-500 font-bold">Gagal memuat Dashboard: Server Sibuk.</div>`;
            }
        }

        // Render Cetak UI Progress Bar di Dashboard
        function renderTabelDash(title, data, headers) {
            let totalSemua = 0;
            let selesaiSemua = 0;

            let rows = Object.entries(data)
                .sort((a, b) => a[0].localeCompare(b[0]))
                .map(([k, v]) => {
                totalSemua += v.total;
                selesaiSemua += v.selesai;
                
                let cols = k.includes('|||') ? k.split('|||') : [k];
                let persen = v.total > 0 ? Math.round((v.selesai/v.total)*100) : 0;
                
                // Komponen Progress Bar
                let progressUI = `
                <div class="flex items-center gap-2 w-full min-w-[120px]" title="${v.selesai} dari ${v.total} selesai">
                    <div class="w-full bg-gray-200 rounded-full h-2">
                        <div class="bg-green-500 h-2 rounded-full transition-all duration-500" style="width: ${persen}%"></div>
                    </div>
                    <span class="text-[10px] font-black text-gray-600 w-8 text-right">${persen}%</span>
                </div>`;

                return `<tr class="border-b hover:bg-gray-50 transition">
                    ${cols.map(c => `<td class="p-3">${c}</td>`).join('')}
                    <td class="p-3 font-bold text-orange-600 text-center">${v.total}</td>
                    <td class="p-3">${progressUI}</td>
                </tr>`;
            }).join('');
            
            let persenSemua = totalSemua > 0 ? Math.round((selesaiSemua/totalSemua)*100) : 0;

            return `
            <div class="bg-white rounded-xl shadow-sm border flex flex-col h-[65vh]">
                <div class="p-4 border-b bg-gray-50 rounded-t-xl flex justify-between items-center">
                    <h3 class="font-bold text-gray-700"><i class="fas fa-chart-bar text-orange-400 mr-2"></i>${title}</h3>
                </div>
                <div class="overflow-y-auto flex-1 p-2">
                    <table class="w-full text-xs text-left">
                        <thead class="sticky top-0 bg-white shadow-sm">
                            <tr class="text-gray-500 uppercase tracking-wider">
                                ${headers.map(h => `<th class="p-3">${h}</th>`).join('')}
                            </tr>
                        </thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>
                <div class="p-3 border-t bg-orange-50 rounded-b-xl flex justify-between items-center text-sm">
                    <span class="font-bold text-gray-700">Total Keseluruhan</span>
                    <div class="flex items-center gap-4">
                        <span class="font-black text-orange-600">${totalSemua} Anomali</span>
                        <span class="font-black text-green-700 bg-green-100 px-2 py-1 rounded-md">${persenSemua}% Tuntas</span>
                    </div>
                </div>
            </div>`;
        }
    </script>
</body>
</html>
