<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SiMANISE2026</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .page-content { display: none; animation: fadeIn 0.3s ease-in-out; }
        .page-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .table-container { max-height: 65vh; overflow-y: auto; }
        thead { position: sticky; top: 0; background-color: #f3f4f6; z-index: 10; box-shadow: 0 1px 2px rgba(0,0,0,0.05);}
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
    </style>
</head>
<body class="bg-gray-100 font-sans text-gray-800 flex h-screen overflow-hidden">

    <aside class="w-64 bg-gray-900 text-white flex flex-col transition-all duration-300">
        <div class="p-6 border-b border-gray-800">
            <h1 class="text-xl font-bold text-orange-400"><i class="fas fa-chart-line mr-2"></i>SIMPANSE</h1>
            <p class="text-xs text-gray-400 mt-1">SIstem Manajemen Penyelesaian ANomali SE2026</p>
        </div>
        <nav class="flex-1 p-4 space-y-2">
            <button onclick="switchPage('dashboard')" id="nav-dashboard" class="nav-btn w-full flex items-center p-3 text-left rounded-lg bg-orange-600 text-white hover:bg-orange-500 transition">
                <i class="fas fa-tachometer-alt w-6"></i> Dashboard
            </button>
            <button onclick="switchPage('keluarga')" id="nav-keluarga" class="nav-btn w-full flex items-center p-3 text-left rounded-lg text-gray-300 hover:bg-gray-800 transition">
                <i class="fas fa-users w-6"></i> Data Keluarga
            </button>
            <button onclick="switchPage('usaha')" id="nav-usaha" class="nav-btn w-full flex items-center p-3 text-left rounded-lg text-gray-300 hover:bg-gray-800 transition">
                <i class="fas fa-store w-6"></i> Data Usaha
            </button>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col h-screen overflow-hidden">
        <!-- Header (Global untuk semua halaman) -->
        <header class="bg-white shadow-sm p-4 flex justify-between items-center z-20">
            <h2 id="header-title" class="text-2xl font-bold text-gray-800">Dashboard Anomali</h2>
            <div class="flex items-center text-sm text-gray-600">
                <i class="far fa-calendar-alt mr-2"></i> <span id="current-date">Hari Ini</span>
                <div class="ml-6 w-8 h-8 bg-blue-500 rounded-full flex items-center justify-center text-white font-bold shadow-md">A</div>
            </div>
        </header>
        
        <!-- Area Konten Halaman (Scrollable) -->
        <div class="p-6 flex-1 overflow-y-auto">
            
            <!-- HALAMAN: DASHBOARD -->
            <div id="page-dashboard" class="page-content active h-full flex flex-col">
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 mb-4 flex gap-4 items-end">
                    <div>
                        <label class="block text-xs font-bold text-gray-600 mb-1">Tanggal Data</label>
                        <input type="date" id="dash-tgl" class="border border-gray-300 p-2 rounded-lg text-sm w-40 outline-none focus:ring-2 focus:ring-orange-400">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-600 mb-1">Jenis Anomali</label>
                        <select id="dash-tipe" class="border border-gray-300 p-2 rounded-lg text-sm outline-none focus:ring-2 focus:ring-orange-400">
                            <option value="Keluarga">Keluarga</option>
                            <option value="Usaha">Usaha</option>
                            <option value="Keluarga+Usaha" selected>Keluarga + Usaha</option>
                        </select>
                    </div>
                    <button onclick="tarikDashboard()" class="bg-orange-600 text-white px-5 py-2 rounded-lg text-sm font-bold hover:bg-orange-500 transition shadow-sm h-[38px] flex items-center">
                        <i class="fas fa-play mr-2"></i> Run Pivot
                    </button>
                </div>
                <div id="dash-container" class="grid grid-cols-1 lg:grid-cols-3 gap-4">
                    <div class="col-span-3 text-center p-10 bg-white border border-gray-200 rounded-xl">
                        <i class="fas fa-chart-pie text-gray-300 text-5xl mb-3 block"></i>
                        <p class="text-gray-500">Pilih tanggal dan jenis anomali, lalu klik <b>Run Pivot</b></p>
                    </div>
                </div>
            </div>

            <!-- HALAMAN: TABEL DATA (Keluarga & Usaha) -->
            <div id="page-data" class="page-content hidden h-full flex flex-col">
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 mb-4 flex flex-wrap justify-between items-end gap-4">
                    <div class="flex flex-wrap gap-4 items-end w-full lg:w-auto">
                        <div>
                            <label class="block font-semibold text-xs text-gray-600 mb-1">Filter Tanggal <span class="text-red-500">*</span></label>
                            <input type="date" id="input-tanggal" class="border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-orange-400 outline-none w-full">
                        </div>
                        <div>
                            <label class="block font-semibold text-xs text-gray-600 mb-1">PML <span class="text-red-500">*</span></label>
                            <select id="input-pml" onchange="renderDropdownPcl()" class="border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-orange-400 outline-none w-full min-w-[150px]">
                                <option value="">Memuat data...</option>
                            </select>
                        </div>
                        <div>
                            <label class="block font-semibold text-xs text-gray-600 mb-1">PCL (Opsional)</label>
                            <select id="input-pcl" class="border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-orange-400 outline-none w-full min-w-[150px]" disabled>
                                <option value="">Pilih PML dahulu</option>
                            </select>
                        </div>
                        <button onclick="tarikData()" id="btn-tarik" class="bg-gray-800 text-white px-5 py-2 rounded-lg text-sm font-semibold hover:bg-gray-700 transition shadow-sm flex items-center h-[38px]">
                            <i class="fas fa-sync-alt mr-2"></i> Tarik Data
                        </button>
                    </div>
                    <div id="status-text" class="text-sm font-medium text-blue-600 hidden whitespace-nowrap"><i class="fas fa-spinner fa-spin mr-1"></i> Berkomunikasi dengan Server...</div>
                </div>
                
                <div class="bg-white flex-1 rounded-xl shadow-sm border border-gray-200 table-container">
                    <table class="w-full text-left text-sm whitespace-nowrap">
                        <thead>
                            <tr class="text-gray-700">
                                <th class="p-4 border-b w-1/4 whitespace-normal" id="th-nama">Nama</th>
                                <th class="p-4 border-b w-48">Anomali</th>
                                <th class="p-4 border-b text-center">Fasih</th>
                                <th class="p-4 border-b">PML</th>
                                <th class="p-4 border-b">PCL</th>
                                <th class="p-4 border-b">Pengerjaan</th>
                                <th class="p-4 border-b min-w-[300px]">Catatan</th>
                            </tr>
                        </thead>
                        <tbody id="tabel-body" class="divide-y divide-gray-100 text-gray-600">
                            <tr><td colspan="7" class="p-8 text-center text-gray-400"><i class="fas fa-inbox text-3xl mb-2 block"></i>Silakan tekan "Tarik Data" untuk memulai</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <script>
        // GANTI teks di bawah ini dengan URL Web App Apps Script Anda!
        const API_URL = "https://script.google.com/macros/s/AKfycbxLgpQJ5jJbr8NvRTQD0DyuW_oRfVGlf8wOH2nFQCS31QaaLJnDBoTRek68fHZj5k-0Kg/exec";
        
        let currentMode = 'dashboard';
        let dataMitraGlobal = {}; // Menyimpan struktur mitra dari server

        // Set Tanggal Hari Ini di Header
        document.getElementById('current-date').innerText = new Date().toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

        // Mengambil struktur Mitra saat web dibuka
        async function muatDataMitra() {
            try {
                const requestOptions = {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: "getMitra" })
                };
                
                const response = await fetch(API_URL, requestOptions);
                const result = await response.json();
                
                if (result.status === "sukses") {
                    dataMitraGlobal = result.data;
                    renderDropdownPml();
                }
            } catch (error) {
                console.error("Gagal memuat data Mitra:", error);
                document.getElementById('input-pml').innerHTML = '<option value="">Gagal memuat data</option>';
            }
        }

        // Mengisi Dropdown PML
        function renderDropdownPml() {
            const pmlSelect = document.getElementById('input-pml');
            pmlSelect.innerHTML = '<option value="">-- Pilih PML --</option>';
            const daftarPml = Object.keys(dataMitraGlobal).sort();
            
            daftarPml.forEach(pml => {
                let option = document.createElement('option');
                option.value = pml; option.text = pml;
                pmlSelect.appendChild(option);
            });
        }

        // Mengisi Dropdown PCL sesuai PML
        function renderDropdownPcl() {
            const pmlTerpilih = document.getElementById('input-pml').value;
            const pclSelect = document.getElementById('input-pcl');
            
            pclSelect.innerHTML = '<option value="">-- Semua PCL --</option>';
            
            if (pmlTerpilih && dataMitraGlobal[pmlTerpilih]) {
                pclSelect.disabled = false;
                const daftarPcl = dataMitraGlobal[pmlTerpilih].sort();
                
                daftarPcl.forEach(pcl => {
                    let option = document.createElement('option');
                    option.value = pcl; option.text = pcl;
                    pclSelect.appendChild(option);
                });
            } else {
                pclSelect.innerHTML = '<option value="">Pilih PML dahulu</option>';
                pclSelect.disabled = true;
            }
        }

        window.onload = () => {
            muatDataMitra();
            // Paksa UI untuk merender tab dashboard dengan rapi di awal
            switchPage('dashboard');
        };

        // FUNGSI NAVIGASI YANG SUDAH DIPERBAIKI
        function switchPage(mode) {
            currentMode = mode;
            
            // 1. Reset warna tombol navigasi (Hapus class aktif, jadikan pasif)
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('bg-orange-600', 'text-white'); 
                btn.classList.add('text-gray-300');
            });
            
            // 2. Beri warna aktif pada tombol yang diklik
            const activeBtn = document.getElementById('nav-' + mode);
            if(activeBtn) {
                activeBtn.classList.remove('text-gray-300');
                activeBtn.classList.add('bg-orange-600', 'text-white');
            }
            
            // 3. Sembunyikan semua konten halaman
            document.querySelectorAll('.page-content').forEach(p => {
                p.classList.remove('active');
                p.classList.add('hidden');
            });
            
            // 4. Tampilkan halaman target dan atur judul Header
            const headerTitle = document.getElementById('header-title');
            
            if (mode === 'dashboard') {
                // Tampilkan container dashboard
                document.getElementById('page-dashboard').classList.remove('hidden');
                document.getElementById('page-dashboard').classList.add('active');
                headerTitle.innerText = 'Dashboard Pivot';
                
            } else {
                // Untuk Keluarga & Usaha, tampilkan container tabel data
                document.getElementById('page-data').classList.remove('hidden');
                document.getElementById('page-data').classList.add('active');
                
                if(mode === 'keluarga') {
                    headerTitle.innerText = 'Manajemen Data Keluarga';
                    document.getElementById('th-nama').innerText = 'Nama Kepala Keluarga';
                } else if(mode === 'usaha') {
                    headerTitle.innerText = 'Manajemen Data Usaha';
                    document.getElementById('th-nama').innerText = 'Nama Usaha';
                }
                
                // Bersihkan baris tabel
                document.getElementById('tabel-body').innerHTML = '<tr><td colspan="7" class="p-8 text-center text-gray-400"><i class="fas fa-inbox text-3xl mb-2 block"></i>Silakan tekan "Tarik Data" untuk memulai</td></tr>';
            }
        }

        async function tarikData() {
            const btn = document.getElementById('btn-tarik');
            const status = document.getElementById('status-text');
            const tgl = document.getElementById('input-tanggal').value;
            const pml = document.getElementById('input-pml').value.trim();
            const pcl = document.getElementById('input-pcl').value.trim();
            const tbody = document.getElementById('tabel-body');

            // Validasi Input Wajib (Diganti pesan UI, bukan alert)
            if (!tgl || !pml) {
                tbody.innerHTML = '<tr><td colspan="7" class="p-8 text-center text-orange-600 font-bold"><i class="fas fa-exclamation-triangle mb-2 text-2xl block"></i>Harap isi Filter Tanggal dan Nama PML terlebih dahulu!</td></tr>';
                return;
            }

            btn.disabled = true; btn.classList.add('opacity-50');
            status.classList.remove('hidden');
            tbody.innerHTML = '<tr><td colspan="7" class="p-8 text-center text-gray-500"><i class="fas fa-circle-notch fa-spin text-2xl mb-2 block"></i>Loading data dari Google Sheets...</td></tr>';

            try {
                const requestOptions = {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: "ambilData", tipe: currentMode, tanggal: tgl, pml: pml, pcl: pcl })
                };

                const response = await fetch(API_URL, requestOptions);
                const result = await response.json();

                if (result.status === "sukses") {
                    renderTabel(result.data);
                } else {
                    throw new Error(result.pesan);
                }
            } catch (error) {
                tbody.innerHTML = `<tr><td colspan="7" class="p-8 text-center text-red-500 font-bold"><i class="fas fa-exclamation-triangle mr-2"></i>Gagal mengambil data: ${error.message}</td></tr>`;
            } finally {
                btn.disabled = false; btn.classList.remove('opacity-50');
                status.classList.add('hidden');
            }
        }

        function renderTabel(data) {
            const tbody = document.getElementById('tabel-body');
            tbody.innerHTML = '';
            
            if(data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="p-8 text-center text-gray-500">Tidak ada data untuk kombinasi filter ini.</td></tr>';
                return;
            }

            data.forEach((row) => {
                let statusColor = row.status === "Sudah Konfirmasi" ? "bg-green-100 text-green-700" : 
                                  row.status === "Sedang Konfirmasi" ? "bg-yellow-100 text-yellow-700" : "bg-red-100 text-red-700";
                
                let linkFasihBtn = row.linkFasih ? 
                    `<a href="${row.linkFasih}" target="_blank" class="text-blue-500 hover:text-white hover:bg-blue-500 bg-blue-50 p-2 rounded-lg transition shadow-sm inline-block" title="Buka Aplikasi Fasih"><i class="fas fa-external-link-alt"></i></a>` : 
                    `<span class="text-gray-300 inline-block p-2" title="Tidak ada link"><i class="fas fa-unlink"></i></span>`;

                let anomaliTeks = row.anomali ? row.anomali.toString().replace(/"/g, '&quot;') : "";
                
                let tr = document.createElement('tr');
                tr.classList.add('hover:bg-orange-50', 'transition', 'group');
                tr.innerHTML = `
                    <td class="p-4 font-semibold text-gray-800 whitespace-normal">${row.nama}</td>
                    <td class="p-4">
                        <div class="max-w-[150px] truncate text-red-600 text-xs font-bold bg-red-50 px-2 py-1.5 rounded-lg border border-red-100 cursor-help" title="${anomaliTeks}">
                            ${row.anomali}
                        </div>
                    </td>
                    <td class="p-4 text-center">${linkFasihBtn}</td>
                    <td class="p-4">${row.pml}</td>
                    <td class="p-4">${row.pcl}</td>
                    <td class="p-4">
                        <select onchange="updateData('${row.id}', 'Pengerjaan', this)" class="p-1.5 text-sm font-semibold border rounded-md shadow-sm outline-none cursor-pointer ${statusColor}">
                            <option value="Belum Konfirmasi" ${row.status === "Belum Konfirmasi" ? "selected":""}>Belum Konfirmasi</option>
                            <option value="Sedang Konfirmasi" ${row.status === "Sedang Konfirmasi" ? "selected":""}>Sedang Konfirmasi</option>
                            <option value="Sudah Konfirmasi" ${row.status === "Sudah Konfirmasi" ? "selected":""}>Sudah Konfirmasi</option>
                        </select>
                    </td>
                    <td class="p-4 min-w-[300px]">
                        <textarea onchange="updateData('${row.id}', 'Catatan', this)" class="w-full border-b-2 border-transparent bg-transparent focus:border-orange-500 outline-none px-2 py-1 text-sm group-hover:bg-white group-hover:border-gray-200 transition rounded resize-y" rows="2" placeholder="Ketik catatan panjang lalu klik di luar kotak...">${row.catatan}</textarea>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function updateData(id, kolom, inputElement) {
            const nilaiBaru = inputElement.value;
            const status = document.getElementById('status-text');
            
            status.innerHTML = `<i class="fas fa-spinner fa-spin mr-1"></i> Menyimpan...`;
            status.classList.remove('hidden', 'text-blue-600', 'text-green-600', 'text-red-600');
            status.classList.add('text-orange-500');
            inputElement.disabled = true;

            try {
                const requestOptions = {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: "updateData", tipe: currentMode, id: id, kolom: kolom, nilai: nilaiBaru })
                };

                const response = await fetch(API_URL, requestOptions);
                const result = await response.json();

                if (result.status === "sukses") {
                    status.innerHTML = `<i class="fas fa-check mr-1"></i> Tersimpan!`;
                    status.classList.replace('text-orange-500', 'text-green-600');
                    if(kolom === 'Pengerjaan') {
                        inputElement.className = `p-1.5 text-sm font-semibold border rounded-md shadow-sm outline-none cursor-pointer ${nilaiBaru === 'Sudah Konfirmasi' ? 'bg-green-100 text-green-700' : nilaiBaru === 'Sedang Konfirmasi' ? 'bg-yellow-100 text-yellow-700' : 'bg-red-100 text-red-700'}`;
                    }
                } else {
                    throw new Error(result.pesan);
                }
            } catch (error) {
                // Diubah dari alert menjadi status error
                status.innerHTML = `<i class="fas fa-times-circle mr-1"></i> Gagal Simpan!`;
                status.classList.replace('text-orange-500', 'text-red-600');
            } finally {
                inputElement.disabled = false;
                setTimeout(() => status.classList.add('hidden'), 3500);
            }
        }

        async function tarikDashboard() {
            const container = document.getElementById('dash-container');
            const tgl = document.getElementById('dash-tgl').value;
            const tipe = document.getElementById('dash-tipe').value;
            
            // Validasi Input
            if(!tgl) {
                container.innerHTML = '<div class="col-span-3 text-center p-10"><p class="text-orange-500 font-bold"><i class="fas fa-exclamation-triangle mb-2 text-2xl block"></i> Harap isi tanggal data terlebih dahulu!</p></div>';
                return;
            }

            container.innerHTML = '<div class="col-span-3 text-center p-10"><i class="fas fa-circle-notch fa-spin text-3xl text-orange-500 mb-3"></i><p class="text-gray-500">Menganalisis data, mohon tunggu...</p></div>';
            
            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: "getDashboard", tipe, tanggal: tgl })
                });
                const {data} = await res.json();
                
                // Mencegah error jika data kosong / tidak ada anomali
                if(Object.keys(data.kec).length === 0) {
                    container.innerHTML = '<div class="col-span-3 text-center p-10 bg-white border border-gray-200 rounded-xl"><p class="text-gray-500"><i class="fas fa-check-circle text-green-500 text-4xl mb-3 block"></i>Tidak ditemukan anomali pada tanggal tersebut.</p></div>';
                    return;
                }

                container.innerHTML = `
                    ${renderTabelDash('Berdasarkan Kecamatan', data.kec, ['Nama Kecamatan', 'Jumlah'])}
                    ${renderTabelDash('Berdasarkan PML', data.pml, ['PML', 'Jumlah'])}
                    ${renderTabelDash('Struktur PML & PCL', data.pmlPcl, ['PML', 'PCL', 'Jumlah'])}
                `;
            } catch (err) {
                 container.innerHTML = `<div class="col-span-3 text-center p-10 text-red-500"><i class="fas fa-times-circle text-4xl mb-3 block"></i>Gagal membuat dashboard: Koneksi terputus.</div>`;
            }
        }

        function renderTabelDash(title, data, headers) {
            let total = 0;
            let rows = Object.entries(data)
                .sort((a, b) => a[0].localeCompare(b[0])) // Mengurutkan berdasarkan abjad A-Z
                .map(([k, v]) => {
                    total += v;
                    let cols = k.includes('|||') ? k.split('|||') : [k];
                    return `<tr class="border-b hover:bg-gray-50">
                        ${cols.map(c => `<td class="p-2">${c}</td>`).join('')}
                        <td class="p-2 font-bold text-orange-600">${v}</td>
                    </tr>`;
                }).join('');
            
            return `
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 h-full flex flex-col">
                <h3 class="font-bold text-gray-700 mb-3 border-b pb-2"><i class="fas fa-table text-orange-400 mr-2"></i>${title}</h3>
                <div class="overflow-y-auto flex-1">
                    <table class="w-full text-sm text-left">
                        <thead><tr class="bg-gray-50 text-gray-500">${headers.map(h => `<th class="p-2">${h}</th>`).join('')}</tr></thead>
                        <tbody>${rows}</tbody>
                        <tfoot><tr class="bg-orange-50 border-t-2 border-orange-200"><td colspan="${headers.length - 1}" class="p-2 font-bold text-right text-gray-700">Total Anomali:</td><td class="p-2 font-black text-orange-600">${total}</td></tr></tfoot>
                    </table>
                </div>
            </div>`;
        }
    </script>
</body>
</html>
